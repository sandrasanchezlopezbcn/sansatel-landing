<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Mitad izquierda: azul -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3A8F"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <!-- Mitad derecha: naranja -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FB923C"/>
    </linearGradient>
    <!-- Anillo exterior degradado estilo Instagram -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F09433"/>
      <stop offset="25%" style="stop-color:#E6683C"/>
      <stop offset="50%" style="stop-color:#DC2743"/>
      <stop offset="75%" style="stop-color:#CC2366"/>
      <stop offset="100%" style="stop-color:#BC1888"/>
    </linearGradient>
    <!-- Clip circular -->
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="182"/>
    </clipPath>
  </defs>

  <!-- Anillo exterior (estilo stories Instagram) -->
  <circle cx="200" cy="200" r="196" fill="url(#ringGrad)"/>
  <!-- Separación blanca entre anillo y círculo -->
  <circle cx="200" cy="200" r="186" fill="#fff"/>

  <!-- Fondo mitad izquierda: azul -->
  <rect x="18" y="18" width="182" height="364" rx="0" fill="url(#leftGrad)" clip-path="url(#circleClip)"/>
  <!-- Fondo mitad derecha: naranja -->
  <rect x="200" y="18" width="182" height="364" rx="0" fill="url(#rightGrad)" clip-path="url(#circleClip)"/>

  <!-- Línea divisoria central sutil -->
  <line x1="200" y1="20" x2="200" y2="380" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" clip-path="url(#circleClip)"/>

  <!-- Icono lado izquierdo (Telecom: señal wifi) -->
  <g transform="translate(80, 138)" opacity="0.7">
    <circle cx="20" cy="46" r="4" fill="white"/>
    <path d="M8 36 Q20 22 32 36" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M1 27 Q20 7 39 27" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Icono lado derecho (Energía: rayo) -->
  <g transform="translate(258, 134)" opacity="0.7">
    <polygon points="25,0 10,28 22,28 15,54 38,20 24,20" fill="white"/>
  </g>

  <!-- Texto SansaTel centrado -->
  <text x="200" y="215"
    font-family="Arial Black, Impact, sans-serif"
    font-size="52"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1"
    style="filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4))">SansaTel</text>

  <!-- Texto inferior -->
  <text x="200" y="240"
    font-family="Arial, sans-serif"
    font-size="12"
    fill="rgba(255,255,255,0.8)"
    text-anchor="middle"
    letter-spacing="3">TELECOM · ENERGÍA</text>
</svg>
